name: smartcura-local

services:
  postgres:
    image: postgres:18.4-alpine3.23@sha256:6ae038add203ffd3e33c20dfff45f6d714afa194facbf0f533b9204cb63cc5ef
    environment:
      POSTGRES_DB: smartcura_dev
      POSTGRES_USER: smartcura_dev
      POSTGRES_PASSWORD: ${SMARTCURA_POSTGRES_PASSWORD:-change-this-local-password}
    ports:
      - '127.0.0.1:5432:5432'
    volumes:
      - smartcura_postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U smartcura_dev -d smartcura_dev']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp
      - /run/postgresql

volumes:
  smartcura_postgres:
