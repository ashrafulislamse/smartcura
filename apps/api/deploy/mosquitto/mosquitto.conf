# Bind to 0.0.0.0 explicitly. Mosquitto 2.0.21 on Alpine/musl can fail with
# "Error creating listener: Try again" (EAI_AGAIN from getaddrinfo) when it
# tries to resolve an implicit bind address during early container startup.
# Specifying the IPv4 any-address bypasses that resolution path.
listener 1883 0.0.0.0
allow_anonymous false
persistence true
persistence_location /mosquitto/data/

# Run as root inside the container. Mosquitto's default is to drop to the
# "mosquitto" user, but the entrypoint creates the password file as root,
# so the unprivileged user cannot read it. The container is already isolated,
# so running the broker as root is acceptable.
user root

# Log to stdout/stderr so Docker captures the output and `docker logs` shows
# the actual error. File logging alone hides the crash reason from Coolify.
log_dest stdout
log_type all

# WebSocket listener for Coolify / TLS-terminating reverse proxy.
# Native MQTT clients can still use port 1883 inside the Docker network.
listener 9001 0.0.0.0
protocol websockets
allow_anonymous false

# Password and ACL files. The password file is created at container startup by
# deploy/mosquitto/entrypoint.sh from the SMARTCURA_MQTT_PASSWORD env var. The
# ACL file is baked into the image; it uses a pattern rule so each device may
# publish only to its own vitals topic — the %u placeholder is the authenticated
# username, which is the device's UUIDv7 id. See deploy/mosquitto/auth/acl.
password_file /mosquitto/config/auth/passwd
acl_file /mosquitto/config/auth/acl
