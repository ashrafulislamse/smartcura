<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" role="img" aria-label="Health Connect sync success">
  <title>Health Connect sync success illustration</title>
  <!-- Phone -->
  <rect x="24" y="44" width="34" height="52" rx="6" stroke="#2563EB" stroke-width="3"/>
  <!-- Heart rate on phone screen -->
  <path d="M41 66c-6 0-10 8-10 14s6 10 10 10 10-4 10-10" stroke="#EF4444" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M35 88h6" stroke="#2563EB" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Watch -->
  <rect x="62" y="24" width="34" height="52" rx="6" stroke="#06B6D4" stroke-width="3"/>
  <!-- Success check on watch -->
  <circle cx="90" cy="56" r="10" stroke="#10B981" stroke-width="3"/>
  <path d="M84 56l4 4 8-9" stroke="#10B981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- ECG pulse line -->
  <path d="M16 100h16l8-8 8 12 8-10 8 6 8-8 8 10 8-8 8 6h16" stroke="#94A3B8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
