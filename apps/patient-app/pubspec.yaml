name: smartcura_patient_app
description: "SmartCura Patient Mobile App - Your complete healthcare companion"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.6
  google_fonts: ^6.1.0
  flutter_svg: ^2.0.9
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0
  lottie: ^3.0.0

  # State Management
  flutter_riverpod: ^2.4.10
  riverpod_annotation: ^2.3.3

  # Navigation
  go_router: ^13.0.0

  # Network & API
  dio: ^5.4.0
  pretty_dio_logger: ^1.3.1
  connectivity_plus: ^7.0.0
  network_info_plus: ^6.0.0

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  sqflite: ^2.3.2
  path_provider: ^2.1.2

  # Authentication
  local_auth: ^2.1.8
  google_sign_in: ^6.2.1

  # Firebase
  firebase_core: ^2.24.2
  firebase_auth: ^4.16.0
  firebase_messaging: ^14.7.10
  firebase_storage: ^11.6.0
  firebase_analytics: ^10.8.0

  # Video Call
  livekit_client: ^2.10.0

  # Real-time Communication
  socket_io_client: ^2.0.3+1

  # Bluetooth Low Energy — real BLE device scanning & pairing
  flutter_blue_plus: ^2.3.12

  # SmartCura generated contracts (path dependency)
  smartcura_contracts:
    path: ../api/packages/contracts/generated/dart

  # Payment
  flutter_stripe: ^10.1.1

  # Location & Maps
  geolocator: ^11.0.0
  google_maps_flutter: ^2.5.3
  geocoding: ^2.1.1

  # Media
  image_picker: ^1.0.7
  # file_picker: ^6.1.1  # TODO: Add when implementing file picking
  permission_handler: ^11.2.0

  # Health Connect (smartwatch vitals sync)
  health: ^13.3.1

  # Open Health Connect settings / permission page when the system dialog is
  # suppressed by OEM skins (e.g. Vivo Funtouch OS).
  android_intent_plus: ^5.0.1

  # Background sync (workmanager) — periodic Health Connect sync
  workmanager: ^0.10.7

  # Utils
  intl: ^0.18.1
  url_launcher: ^6.2.4
  share_plus: ^10.0.0
  package_info_plus: ^8.0.0
  device_info_plus: ^12.4.0
  flutter_dotenv: ^5.1.0
  uuid: ^4.3.3

  # Date & Time
  table_calendar: ^3.0.9

  # Charts & Graphs
  fl_chart: ^0.66.2

  # QR Code
  qr_flutter: ^4.1.0
  mobile_scanner: ^6.0.2
  # qr_code_scanner: ^1.0.1  # TODO: Add when implementing QR scanning

  # Notifications
  flutter_local_notifications: ^17.2.2

  # Biometric
  local_auth_android: ^1.0.38
  local_auth_ios: ^1.1.6
  app_links: ^7.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Linting
  flutter_lints: ^3.0.1

  # Code Generation
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1

  # Testing
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # Assets
  assets:
    - assets/images/
    - assets/icons/
    - assets/illustrations/
    - assets/animations/
    # - .env  # TODO: Add when using environment variables

  # Fonts (if using custom fonts)
  # fonts:
  #   - family: Poppins
  #     fonts:
  #       - asset: assets/fonts/Poppins-Regular.ttf
  #       - asset: assets/fonts/Poppins-Bold.ttf
  #         weight: 700
